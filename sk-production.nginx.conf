# NGINX Configuration for SK Store Production Deployment
# Place this configuration in /etc/nginx/sites-available/skstore and link to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # Replace with your actual domain

    # Path to static export folder (content of out/ directory)
    root /var/www/sk-frontend/out;
    index index.html;

    # Gzip Compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Clean HTML Route handling for Next.js Export
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache Next.js Static Assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache Public Media & Images
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
